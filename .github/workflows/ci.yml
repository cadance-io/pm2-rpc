name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Tests need a live PM2 daemon and don't run on stock GitHub-hosted
  # runners — CI validates lint / format / typecheck / build instead.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv build
