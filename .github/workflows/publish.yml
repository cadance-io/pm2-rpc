name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
      - run: uv sync --group dev
      - name: Verify tag matches package version
        # GITHUB_REF is a trusted Actions-supplied env var, not user input.
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(grep '^version' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PKG"
            exit 1
          fi
      # Tests run on every push/PR via ci.yml — publish skips them to
      # keep the release path fast and decoupled from network/runtime
      # state. The tag gate above is the merge-readiness signal.
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # No checkout / sync here — we only need the uv binary to invoke
      # `uv publish` against the artifact downloaded below. Disable caching
      # since there is no lockfile in the workdir for setup-uv to key on.
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: uv publish --trusted-publishing always
