name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - name: Verify tag matches package version
        # GITHUB_REF is a trusted Actions-supplied env var, not user input.
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(grep '^version' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PKG"
            exit 1
          fi
      # NOTE: the test suite drives a real PM2 daemon and cannot run in CI,
      # so we only validate the build artifact here. Run `uv run pytest`
      # locally before tagging a release.
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: uv publish --trusted-publishing always
