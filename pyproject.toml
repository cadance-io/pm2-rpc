[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pm2-rpc"
version = "0.2.1"
description = "Pure-Python client for PM2's daemon RPC socket"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Paul Soares"}]
keywords = ["pm2", "rpc", "axon", "amp", "process-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]

[project.urls]
Repository = "https://github.com/cadance-io/pm2-rpc"
Issues = "https://github.com/cadance-io/pm2-rpc/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=9.0.3",
    "pyyaml>=6",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["pm2_rpc"]

[tool.hatch.build.targets.sdist]
only-include = ["pm2_rpc", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["pm2_rpc"]
strict_equality = true
warn_unused_ignores = true
